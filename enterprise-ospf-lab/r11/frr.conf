frr version 8.4_git
frr defaults traditional
hostname 0fa685a1f16a
no ipv6 forwarding
hostname frr
service integrated-vtysh-config
!
interface eth0
 ip ospf area 3
 ip ospf cost 12
 ip ospf network point-to-point
exit
!
interface eth1
 ip ospf area 0
 ip ospf cost 20
 ip ospf network point-to-point
exit
!
interface eth2
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 11.11.11.11
exit
!
