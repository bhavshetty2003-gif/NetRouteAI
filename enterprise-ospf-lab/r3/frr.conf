frr version 10.0
hostname r3
service integrated-vtysh-config

interface eth0
 ip address 10.0.0.10/30
 ip ospf area 0

interface eth1
 ip address 10.0.0.18/30
 ip ospf area 0

interface eth2
 ip address 10.0.0.22/30
 ip ospf area 0

interface eth3
 ip address 10.1.0.1/30
 ip ospf area 1

router ospf
 ospf router-id 3.3.3.3

line vty