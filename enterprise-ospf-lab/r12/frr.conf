frr version 8.4_git
frr defaults traditional
hostname 7544cbde8d6a
no ipv6 forwarding
hostname frr
service integrated-vtysh-config
!
interface eth0
 ip ospf area 1
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth1
 ip ospf area 0
 ip ospf cost 5
 ip ospf network point-to-point
exit
!
interface eth2
 ip ospf area 1
 ip ospf cost 8
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 12.12.12.12
exit
!
