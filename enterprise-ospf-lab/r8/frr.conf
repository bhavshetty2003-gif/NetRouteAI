frr version 8.4_git
frr defaults traditional
hostname frr
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip ospf area 3
 ip ospf cost 15
 ip ospf network point-to-point
exit
!
interface eth1
 ip ospf area 3
 ip ospf cost 15
 ip ospf network point-to-point
exit
!
interface eth2
 ip ospf area 3
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
interface eth3
 ip ospf area 0
 ip ospf cost 10
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 8.8.8.8
exit
!