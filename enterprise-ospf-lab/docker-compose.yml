version: "3.8"

services:
  r1:
    image: frrouting/frr:latest
    container_name: r1
    privileged: true
    command: /usr/lib/frr/docker-start
    volumes:
      - ./frr/daemons:/etc/frr/daemons
      - ./frr/vtysh.conf:/etc/frr/vtysh.conf
      - ./r1/frr.conf:/etc/frr/frr.conf
    networks:
      r1_r2:
        ipv4_address: 10.0.0.2
      r1_r12:
        ipv4_address: 10.0.0.10

  r2:
    image: frrouting/frr:latest
