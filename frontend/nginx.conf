# One origin, two services. The UI is static files; everything the API serves
# is proxied to the backend container, so the browser never sees a second
# origin and `API_BASE` in src/utils/config.ts is correctly empty.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Topology uploads are JSON and a large canvas is not tiny.
    client_max_body_size 20m;

    # Three prefixes, because the backend's routes are not all under /api:
    # /upload-topology predates the /api prefix, and /health is the probe.
    # proxy_pass with no path passes the original URI through unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The default 60s is shorter than the work behind some calls:
        # POST /api/lab/deploy waits up to 90s for routers to reach "running"
        # on top of a 300s `docker compose up`, and /api/lab/reachability sweeps
        # the whole pair matrix. A 60s cut-off shows up as a 504 in the UI while
        # the backend is still doing exactly what was asked of it.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /upload-topology {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite writes content-hashed files here, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Anything else — including a deep link or a refresh on a route the SPA
    # handles itself — is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or a deploy leaves browsers holding the
    # old asset hashes and every one of them 404s on first load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
