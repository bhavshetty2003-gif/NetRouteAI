services:
  r1:
    image: frrouting/frr:latest
    container_name: r1
    privileged: true
    command: /usr/lib/frr/docker-start
    volumes:
    - ./r1:/etc/frr
    networks:
      net1:
        ipv4_address: 10.0.1.2
  r2:
    image: frrouting/frr:latest
    container_name: r2
    privileged: true
    command: /usr/lib/frr/docker-start
    volumes:
    - ./r2:/etc/frr
    networks:
      net1:
        ipv4_address: 10.0.1.3
      net2:
        ipv4_address: 10.0.2.2
  pc1:
    image: alpine
    container_name: pc1
    command: sleep infinity
    networks:
      net2:
        ipv4_address: 10.0.2.3
networks:
  net1:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.1.0/29
  net2:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.2.0/29
